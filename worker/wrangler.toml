# Empfänger für Selbsttest-Berichte und Problem-Meldungen aus Moes Apps (Mountpoint: Reporter.swift,
# MediaFiles Check: src/report.rs, …). Legt jeden Bericht als JSON-Datei und als Issue im privaten Repo seiner App ab
# (Feld "product" → REPOS; ohne "product" = Mountpoint). Free-Plan, keine Zahlungsdaten.
name = "mountpoint-reports"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
REPOS = '{"mountpoint": "moritz-poth/mountpoint-reports", "mediafiles-check": "moritz-poth/mediafiles-check-reports"}'
MAX_PER_DAY = "50"      # Berichte pro Tag insgesamt
MAX_PER_HOUR_IP = "10"  # Berichte pro Stunde, Absender und App (5 für alle Apps zusammen reichte beim Testen nicht)

# Zähler für die Limits (id nach `npx wrangler kv namespace create LIMITS` eintragen)
[[kv_namespaces]]
binding = "LIMITS"
id = "efccd83f7f0b40bc84c2c38ea77948c2"

# Secret (nicht hier eintragen!): npx wrangler secret put GITHUB_TOKEN
# Fine-grained token, nur die Repos aus REPOS, Rechte: Contents read/write, Issues read/write.
